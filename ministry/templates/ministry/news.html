{% extends 'base.html' %}

{% block title %}교회 소식 · 투명한 사역 교회{% endblock %}
{% block app_title %}📢 교회 소식{% endblock %}

{% block content %}
<div class="space-y-10 px-4 pt-5">
    <!-- Notion Notices -->
    <section>
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">공지사항</h2>
            <span class="rounded-full bg-slate-100 px-3 py-1 font-mono text-[11px] text-slate-500 dark:bg-slate-800">Synced
                with Notion</span>
        </div>

        <div id="notion-list" class="space-y-3">
            {% include 'ministry/partials/notion_list.html' %}
        </div>
    </section>

    <!-- Instagram -->
    <section>
        <div class="mb-4 flex items-center justify-between">
            <h2 class="flex items-center text-xl font-bold text-slate-900 dark:text-white">
                <span
                    class="mr-2 rounded-lg bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-1.5 text-base text-white">📸</span>
                교회 인스타그램
            </h2>
            <a href="https://www.instagram.com/choihyunseok_/" target="_blank" rel="noopener"
                class="font-mono text-xs text-slate-400 active:text-brand-600">@choihyunseok_</a>
        </div>

        <div
            class="overflow-hidden rounded-3xl border border-slate-100 bg-white p-3 shadow-xl dark:border-slate-700 dark:bg-slate-800">
            <script src="https://snapwidget.com/js/snapwidget.js"></script>
            <iframe src="https://snapwidget.com/embed/1114826" class="snapwidget-widget" allowtransparency="true"
                frameborder="0" scrolling="no" loading="lazy"
                style="border:none; overflow:hidden; width:100%; height:800px;"
                title="홈페이지 제작자 인스타그램 Mobile"></iframe>
        </div>
    </section>
</div>
{% endblock %}
